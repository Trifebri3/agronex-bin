services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecosense_hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/var/www/storage
      - ./database:/var/www/database
    environment:
      - APP_NAME=EcoSenseHub
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
